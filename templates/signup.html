{% extends "base.html" %}

{% block title %}Sign Up - Xtopus{% endblock %}

{% block content %}
<div class="form-container">
    <h2 style="text-align:center; margin-bottom:1.5rem;">Create Your Account</h2>
    
    <form action="/api/auth/signup" method="post" id="signupForm">
        <div class="form-group">
            <label class="form-label">User ID</label>
            <input type="text" name="user_id" class="form-control" required minlength="3" placeholder="Choose a unique username" id="signupUserId">
        </div>
        
        <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required placeholder="your@email.com" id="signupEmail">
        </div>
        
        <div class="form-group">
            <label class="form-label">First Name</label>
            <input type="text" name="first_name" class="form-control" required id="signupFirstName">
        </div>
        
        <div class="form-group">
            <label class="form-label">Last Name</label>
            <input type="text" name="last_name" class="form-control" required id="signupLastName">
        </div>
        
        <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required minlength="8" placeholder="Minimum 8 characters" id="signupPassword">
        </div>
        
        <div class="form-group">
            <label class="form-label">Confirm Password</label>
            <input type="password" name="password_confirm" class="form-control" required id="signupPasswordConfirm">
        </div>
        
        <div class="form-group">
            <label class="form-label">Gender</label>
            <select name="gender" class="form-control" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
        </div>
        
        <div class="form-group">
            <label class="form-label">Age</label>
            <input type="number" name="age" class="form-control" required min="18" max="120">
        </div>
        
        <div class="form-group">
            <label class="form-label">Country</label>
            <input type="text" name="country" class="form-control" required placeholder="Your country">
        </div>
        
        <button type="submit" class="btn btn-primary" id="signupButton" style="width:100%;">Sign Up</button>
    </form>
    
    <p style="text-align:center; margin-top:1rem;">
        Already have an account? <a href="/login" style="color:#8B5CF6;">Login</a>
    </p>
</div>

<script>
document.getElementById('signupForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const password = this.querySelector('input[name="password"]').value;
    const confirm = this.querySelector('input[name="password_confirm"]').value;
    const button = document.getElementById('signupButton');
    
    if (password !== confirm) {
        alert('Passwords do not match!');
        return;
    }
    
    if (password.length < 8) {
        alert('Password must be at least 8 characters long!');
        return;
    }
    
    // Show spinner on button
    const originalText = button.textContent;
    button.innerHTML = '<span class="spinner-small"></span> Creating account...';
    button.disabled = true;
    button.classList.add('btn-loading');
    
    // Submit the form
    this.submit();
});
</script>
{% endblock %}
