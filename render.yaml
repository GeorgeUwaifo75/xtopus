services:
  - type: web
    name: xtopus
    runtime: python
    region: frankfurt
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 8000
      - key: FIREBASE_STORAGE_BUCKET
        value: giteksolhub-project.firebasestorage.app
      - key: FIREBASE_CREDENTIALS_BASE64
        value: 